<form class="search-form" [formGroup]="cityForm" (ngSubmit)="onSubmit()">
  <div class="search-input-wrapper">
    <span class="search-icon">⌕</span>
    <input
      type="text"
      id="city"
      formControlName="city"
      placeholder="Search city..."
      autocomplete="off"
      class="search-input">
  </div>
  <button type="submit" class="search-button">
    Search
  </button>
</form>
